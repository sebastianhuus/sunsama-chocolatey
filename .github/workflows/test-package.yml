name: Test Package

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:  # Manual trigger
  pull_request:
    paths:
      - 'package/**'

permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Pack package
        run: choco pack
        working-directory: package
      
      - name: Install package
        id: test
        continue-on-error: true
        run: choco install --source=. sunsama -y
        working-directory: package
      
      - name: Verify installation
        id: verify
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: |
          if (Test-Path "$env:LOCALAPPDATA\Programs\Sunsama\Sunsama.exe") {
            Write-Host "✓ Sunsama installed successfully"
          } else {
            Write-Error "✗ Sunsama.exe not found"
            exit 1
          }
      
      - name: Trigger auto-fix workflow
        if: (steps.test.outcome == 'failure' || steps.verify.outcome == 'failure') && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-fix.yml',
              ref: 'main'
            });
      
      - name: Fail job if tests failed
        if: steps.test.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: exit 1
